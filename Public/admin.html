*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c1c1c;background:#f8f8f8}
button,input,select{font:inherit}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.pad{padding:24px;width:100%;max-width:340px;display:grid;gap:12px}
h1{margin:0;font-size:20px}.red{color:var(--red)}
input,select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-width:0}
input:focus,select:focus,.btn:focus-visible,.tabs button:focus-visible{outline:2px solid #fbd3d6;border-color:var(--red)}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:#1c1c1c;border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--red);margin:0;min-height:1.2em;font-weight:600}
/* brand: the site logo (gold on transparent) sits on a black circle, same as the customer site */
.logo{display:block;flex:none;width:44px;height:44px;border-radius:50%;background:#000 var(--logo) center/84% no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-size:17px;line-height:1.15;letter-spacing:-.01em}
.brand small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.login-brand{display:grid;justify-items:center;gap:8px;text-align:center}
.login-brand .logo{width:84px;height:84px}
.login-brand b{font-size:22px;line-height:1.1}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.sp{flex:1}.mut{color:var(--mut);font-size:12px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite}
.live.off{color:var(--red)}.live.off i{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.wrap{max-width:1250px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:14px}.stat small{display:block;color:var(--mut);font-weight:600}.stat b{font-size:24px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.tabs .on{background:#1c1c1c;color:#fff;border-color:#1c1c1c}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input{flex:1;min-width:200px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;background:#fafafa}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.new td{background:#fff8f8}.items div{white-space:nowrap}
.st{font-weight:700;border-radius:8px}.st-New{background:#fff3cd}.st-Preparing{background:#dbeafe}.st-Completed{background:#dcfce7}.st-Cancelled{background:#e5e7eb}
td.empty{text-align:center;color:var(--mut);padding:30px}
/* tappable Order ID / customer name */
.link{background:none;border:0;padding:4px 0;font:inherit;font-weight:800;color:var(--red);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.link:hover,.link:focus-visible{text-decoration-color:currentColor;outline:0}
/* floating details window */
.pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.5)}
.pop-card{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:calc(100% - 8px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pop-head h2{margin:0;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.x{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer;color:#444}
.x:hover{background:#f3f3f3}.x:focus-visible{outline:2px solid #fbd3d6;border-color:var(--red)}
.pop-body{padding:6px 18px 18px;overflow-y:auto}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.sec{margin:16px 0 2px;font-size:13px;font-weight:700;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.row span{color:var(--mut)}.row b{text-align:right}
.row.item span{color:#1c1c1c}.row.item b,.row.total b{white-space:nowrap}
.row.total{border-bottom:0;font-size:16px;padding-top:12px}.row.total span{color:#1c1c1c;font-weight:700}
.note{margin:12px 0 0;color:var(--mut);font-size:12px}
</style></head><body>
<div id="login" class="center"><form class="card pad" onsubmit="return doLogin(event)">
 <div class="login-brand"><span class="logo" role="img" aria-label="Hungerr Station logo"></span><b>Hungerr <span class="red">Station</span></b><span class="mut">Admin panel</span></div>
 <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
 <p id="lerr" class="err" role="alert"></p><button class="btn">Login</button>
</form></div>

<div id="app" hidden>
 <header class="bar">
  <div class="brand"><span class="logo" role="img" aria-label="Hungerr Station logo"></span><div><b>Hungerr <span class="red">Station</span></b><small>Admin panel</small></div></div>
  <span class="sp"></span>
  <span id="live" class="live" role="status"><i></i><span id="upd">Connecting...</span></span>
  <button class="btn ghost" onclick="load()">Refresh</button><button class="btn ghost" onclick="logout()">Logout</button>
 </header>
 <main class="wrap">
  <section id="stats" class="stats"></section>
  <nav class="tabs"><button id="t-orders" class="on" onclick="tab('orders')">Orders</button><button id="t-customers" onclick="tab('customers')">Customers</button></nav>
  <div class="tools">
   <input id="q" placeholder="Search name, mobile or order ID" oninput="draw()">
   <select id="fb" onchange="draw()"><option value="">All branches</option><option value="manpura">Borkheda, Kota</option><option value="rang">Umed Bhawan Palace, Kota</option></select>
   <select id="fs" onchange="draw()"><option value="">All statuses</option><option>New</option><option>Preparing</option><option>Completed</option><option>Cancelled</option></select>
   <button id="xl" class="btn ghost" onclick="exportXlsx()" title="Downloads the list you are looking at, with the current search and filters applied">Export to Excel</button>
  </div>
  <div class="card scroll"><table id="tbl"></table></div>
 </main>
</div>

<div id="pop" class="pop" hidden>
 <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="pt">
  <div class="pop-head"><h2 id="pt"></h2><button id="px" class="x" type="button" aria-label="Close">&times;</button></div>
  <div id="pb" class="pop-body"></div>
 </div>
</div>

<script>
const BR={manpura:'Borkheda, Kota',rang:'Umed Bhawan Palace, Kota'},PAY={cash:'Cash',paytm:'Paytm',gpay:'Google Pay',phonepe:'PhonePe'},ST=['New','Preparing','Completed','Cancelled'];
const POLL_MS=2000;   // how often the panel asks "did anything change?" (one tiny request)
let tok=sessionStorage.getItem('hs_admin'),D={orders:[],customers:[]},view='orders',timer,ver=null,lastLoad=0,busy=false,dirty=false,okText='Live';
const $=id=>document.getElementById(id);
const h=(t,c,...k)=>{const e=document.createElement(t);if(c)e.className=c;e.append(...k);return e};   // text only, never innerHTML
const td=(...k)=>h('td','',...k),inr=n=>'\u20B9'+Number(n).toLocaleString('en-IN');
const when=s=>s?new Date(s).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'-';
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})}});
 if(r.status===401&&tok){logout();throw new Error('Session expired. Please log in again.')}
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function doLogin(e){e.preventDefault();$('lerr').textContent='';
 try{tok=null;const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});tok=d.token;sessionStorage.setItem('hs_admin',tok);$('pw').value='';start()}
 catch(x){$('lerr').textContent=x.message}return false}
function logout(){closePop();tok=null;sessionStorage.removeItem('hs_admin');clearInterval(timer);$('app').hidden=true;$('login').hidden=false}

/* ---- live refresh: poll one tiny "version" number, download the full data only when it changed ---- */
const live=(ok,t)=>{$('live').className='live'+(ok?'':' off');if(t)$('upd').textContent=t};
function start(){$('login').hidden=true;$('app').hidden=false;ver=null;tick();clearInterval(timer);timer=setInterval(tick,POLL_MS)}
async function tick(){
 if(busy||!tok)return;busy=true;
 try{const p=await api('/api/admin/ping');
  if(p.v!==ver||Date.now()-lastLoad>60000){ver=p.v;await load()}   // also a full reload once a minute as a safety net
  else live(true,okText)}
 catch(x){live(false,x.message==='Failed to fetch'?'Offline. Retrying...':x.message)}
 finally{busy=false}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
async function load(){
 try{D=await api('/api/admin/data');lastLoad=Date.now();okText='Live \u00B7 updated '+new Date().toLocaleTimeString('en-IN',{timeStyle:'medium'});live(true,okText);
  const a=document.activeElement;   // don't redraw under the person's finger while a status dropdown is open
  if(a&&a.tagName==='SELECT'&&$('tbl').contains(a)){dirty=true;stats()}else draw();
  return true}
 catch(x){live(false,x.message);ver=null;return false}}
$('tbl').addEventListener('focusout',()=>{if(dirty){dirty=false;setTimeout(draw,0)}});

function stats(){const t=new Date().toDateString(),live_=D.orders.filter(o=>o.status!=='Cancelled'),td_=live_.filter(o=>new Date(o.ts).toDateString()===t);
 const S=[['Orders today',td_.length],['Revenue today',inr(td_.reduce((a,o)=>a+o.total,0))],['New orders',D.orders.filter(o=>o.status==='New').length],['Customers',D.customers.length]];
 $('stats').replaceChildren(...S.map(([l,v])=>h('div','card stat',h('small','',l),h('b','',String(v)))))}
function tab(v){view=v;$('t-orders').className=v==='orders'?'on':'';$('t-customers').className=v==='customers'?'on':'';$('fs').hidden=v!=='orders';draw()}
const head=(...c)=>{const r=h('tr');r.append(...c.map(x=>h('th','',x)));return r};
const empty=n=>{const r=h('tr'),d=h('td','empty','Nothing here yet');d.colSpan=n;r.append(d);return r};
function orderRow(o){const tr=h('tr',o.status==='New'?'new':''),sel=h('select','st st-'+o.status);
 ST.forEach(s=>{const op=h('option','',s);op.value=s;op.selected=s===o.status;sel.append(op)});
 sel.onchange=async()=>{try{await api('/api/admin/orders/'+encodeURIComponent(o.id)+'/status',{method:'PATCH',body:JSON.stringify({status:sel.value})});o.status=sel.value;draw()}catch(x){alert(x.message);load()}};
 const items=h('td','items');o.items.forEach(i=>items.append(h('div','',i.name+' \u2013 '+inr(i.price))));
 tr.append(td(linkBtn(o.id,b=>openPop('order',o.id,b))),td(when(o.ts)),td(h('b','',o.name),h('div','mut','+91 '+o.phone)),td(BR[o.branch]||o.branch||'-'),items,td(o.mode==='delivery'?'Delivery':'Dining / Takeaway'),td(PAY[o.pay]||o.pay),td(h('b','',inr(o.total))),td(sel));return tr}

/* ---- the lists the table shows (also what the Excel export uses, so the file matches the screen) ---- */
const hit=(q,...a)=>!q||a.join(' ').toLowerCase().includes(q);
function orderList(){const q=$('q').value.trim().toLowerCase(),fb=$('fb').value,fs=$('fs').value;
 return D.orders.filter(o=>(!fb||o.branch===fb)&&(!fs||o.status===fs)&&hit(q,o.id,o.name,o.phone))}
function custList(){const q=$('q').value.trim().toLowerCase(),fb=$('fb').value;
 return D.customers.filter(c=>(!fb||c.branch===fb)&&hit(q,c.name,c.phone)).sort((a,b)=>(b.lastSeen||'').localeCompare(a.lastSeen||''))}
function spend(){const agg={};D.orders.filter(o=>o.status!=='Cancelled').forEach(o=>{const a=agg[o.phone]||(agg[o.phone]={n:0,s:0});a.n++;a.s+=o.total});return agg}

function draw(){drawTable();renderPop()}
function drawTable(){stats();const T=$('tbl');
 if(view==='orders'){const L=orderList();
  T.replaceChildren(head('Order','Time','Customer','Branch','Items','Type','Payment','Total','Status'),...(L.length?L.map(orderRow):[empty(9)]));return}
 const agg=spend(),L=custList();
 T.replaceChildren(head('Name','Mobile','Gender','Date of birth','Branch','Orders','Total spent','Joined','Last seen'),...(L.length?L.map(c=>{const a=agg[c.phone]||{n:0,s:0},tr=h('tr');
  tr.append(td(linkBtn(c.name,b=>openPop('customer',c.phone,b))),td('+91 '+c.phone),td(c.gender||'-'),td(c.dob?new Date(c.dob+'T00:00').toLocaleDateString('en-IN',{dateStyle:'medium'}):'-'),td(BR[c.branch]||c.branch||'-'),td(String(a.n)),td(inr(a.s)),td(when(c.createdAt)),td(when(c.lastSeen)));return tr}):[empty(9)]))}

/* ---- export to Excel (.xlsx). The library loads only when you click Export; if it can't load, a CSV that Excel opens is saved instead ---- */
const dstr=s=>s?new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';
const tstr=s=>s?new Date(s).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
function sheetData(){
 if(view==='orders')return{name:'Orders',file:'hungerr-orders',
  head:['Order ID','Date','Time','Customer','Mobile','Branch','Items','Type','Payment','Subtotal (\u20B9)','Total (\u20B9)','Status'],
  rows:orderList().map(o=>[o.id,dstr(o.ts),tstr(o.ts),o.name,o.phone,BR[o.branch]||o.branch||'',o.items.map(i=>i.name+' \u2013 \u20B9'+i.price).join('; '),o.mode==='delivery'?'Delivery':'Dining / Takeaway',PAY[o.pay]||o.pay||'',o.subtotal,o.total,o.status])};
 const agg=spend();
 return{name:'Customers',file:'hungerr-customers',
  head:['Name','Mobile','Gender','Date of birth','Branch','Orders','Total spent (\u20B9)','Joined','Last seen'],
  rows:custList().map(c=>{const a=agg[c.phone]||{n:0,s:0};return[c.name,c.phone,c.gender||'',c.dob?dstr(c.dob+'T00:00'):'',BR[c.branch]||c.branch||'',a.n,a.s,when(c.createdAt),when(c.lastSeen)]})}}
function loadXlsx(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('library blocked'));document.head.append(s)})}
function saveCsv(d,stamp){   // fallback; text starting with = + - @ is prefixed so Excel never treats customer-typed text as a formula
 const cell=v=>{v=v==null?'':v;if(typeof v==='string'&&/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+String(v).replace(/"/g,'""')+'"'};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+[d.head,...d.rows].map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
 a.download=d.file+'-'+stamp+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function exportXlsx(){
 const d=sheetData(),stamp=new Date().toLocaleDateString('en-CA'),btn=$('xl');
 if(!d.rows.length){alert('Nothing to export. Clear the search or filters and try again.');return}
 btn.disabled=true;
 try{await loadXlsx();
  const ws=XLSX.utils.aoa_to_sheet([d.head,...d.rows]);
  ws['!cols']=d.head.map((t,i)=>({wch:Math.min(55,d.rows.reduce((m,r)=>Math.max(m,String(r[i]==null?'':r[i]).length),String(t).length)+2)}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,d.name);XLSX.writeFile(wb,d.file+'-'+stamp+'.xlsx')}
 catch(e){saveCsv(d,stamp);alert('The Excel library could not load, so a CSV file was saved instead. Excel opens it normally.')}
 finally{btn.disabled=false}}
/* ---- floating details window: tap an Order ID (all items) or a customer name (profile + spend) ---- */
let pop=null;
const sgn=n=>(n<0?'\u2212':'+')+inr(Math.abs(n));
const line=(l,v)=>h('div','row',h('span','',l),h('b','',v));
const linkBtn=(text,fn)=>{const b=h('button','link',text);b.type='button';b.onclick=()=>fn(b);return b};
function openPop(kind,key,trigger){pop={kind,key,trigger};$('pop').hidden=false;document.body.style.overflow='hidden';renderPop();$('pb').scrollTop=0;$('px').focus()}
function closePop(){if(!pop)return;const t=pop.trigger;pop=null;$('pop').hidden=true;document.body.style.overflow='';if(t&&t.isConnected)t.focus()}
function renderPop(){   // runs on open and after every live refresh, so an open window never shows stale data
 if(!pop)return;const B=$('pb'),T=$('pt'),keep=B.scrollTop;
 if(pop.kind==='order'){
  const o=D.orders.find(x=>x.id===pop.key);if(!o)return closePop();
  const g={};o.items.forEach(i=>{const k=i.id+'|'+i.name;(g[k]=g[k]||{name:i.name,price:i.price,q:0}).q++});   // same dish twice -> "2 x"
  const sub=o.subtotal!=null?o.subtotal:o.items.reduce((a,i)=>a+i.price,0),adj=(o.total||0)-sub;
  T.replaceChildren('Order '+o.id,h('span','badge st-'+o.status,o.status));
  B.replaceChildren(
   h('h3','sec','Items ('+o.items.length+')'),
   ...Object.values(g).map(i=>h('div','row item',h('span','',i.q+' \u00D7 '+i.name),h('b','',inr(i.price*i.q)))),
   line('Subtotal',inr(sub)),
   ...(adj?[line('Delivery fee / discount',sgn(adj))]:[]),
   h('div','row total',h('span','','Total'),h('b','',inr(o.total))),
   h('h3','sec','Order details'),
   line('Time',when(o.ts)),line('Customer',o.name+' (+91 '+o.phone+')'),line('Branch',BR[o.branch]||o.branch||'-'),
   line('Type',o.mode==='delivery'?'Delivery':'Dining / Takeaway'),line('Payment',PAY[o.pay]||o.pay||'-'))}
 else{
  const c=D.customers.find(x=>x.phone===pop.key);if(!c)return closePop();
  const a=spend()[c.phone]||{n:0,s:0};
  T.replaceChildren('Customer details');
  B.replaceChildren(
   line('Name',c.name),line('Mobile','+91 '+c.phone),line('Gender',c.gender||'-'),
   line('Date of birth',c.dob?new Date(c.dob+'T00:00').toLocaleDateString('en-IN',{dateStyle:'medium'}):'-'),
   line('Total orders',String(a.n)),line('Total spent',inr(a.s)),line('Joined',when(c.createdAt)),line('Last seen',when(c.lastSeen)),
   h('p','note','Cancelled orders are not counted in total orders and total spent.'))}
 B.scrollTop=keep}
$('px').onclick=closePop;
$('pop').addEventListener('click',e=>{if(e.target===$('pop'))closePop()});   // tap outside the window to close
document.addEventListener('keydown',e=>{if(!pop)return;if(e.key==='Escape')closePop();else if(e.key==='Tab'){e.preventDefault();$('px').focus()}});
if(tok)start();
</script></body></html>
